name: CI/CD seguro · Axenor

# Zero Trust: cada push se verifica explícitamente. El despliegue solo ocurre si
# TODAS las puertas de calidad de seguridad pasan, y requiere aprobación humana
# (GitHub Environment) antes de tocar producción.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Menor privilegio para el GITHUB_TOKEN: solo lectura del repositorio.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # PUERTAS DE CALIDAD DE SEGURIDAD — se ejecutan ANTES del build.
  # Si cualquiera falla, el pipeline se rompe y no se despliega.
  # ===========================================================================
  security-gates:
    name: Security quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # historial completo para el escaneo de secretos

      # ---- Gate 1: Escaneo de secretos (gitleaks CLI, sin licencia) -----------
      # La GitHub Action 'gitleaks-action' exige GITLEAKS_LICENSE en organizaciones
      # (incluso en repos públicos). El binario gitleaks es MIT/libre, así que lo
      # descargamos y ejecutamos directo: mismo motor, cero licencia.
      - name: Secret scanning (gitleaks)
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          chmod +x ./gitleaks
          # Escanea el árbol de trabajo; sale con código !=0 si hay un secreto.
          ./gitleaks dir . --redact --exit-code 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile estricto)
        run: npm ci --ignore-scripts # ignore-scripts: mitiga ejecución arbitraria en postinstall

      # ---- Gate 2: SCA — rompe si hay deps de PRODUCCIÓN vulnerables ----------
      - name: SCA · npm audit (producción, bloqueante)
        run: npm audit --omit=dev --audit-level=high

      # Informativo: vulnerabilidades de tooling de desarrollo (no bloquea deploy
      # porque no entran al bundle), pero quedan visibles en el log.
      - name: SCA · npm audit (dev, informativo)
        run: npm audit --audit-level=high || true

      # ---- Gate 3: Análisis estático (type-check + linter) --------------------
      - name: SAST · Type check
        run: npx tsc --noEmit

      # La Function de Cloudflare (functions/) queda fuera de tsconfig "src";
      # se type-checkea con su propia config para no enviar el backend sin verificar.
      - name: SAST · Type check (functions)
        run: npx tsc -p functions/tsconfig.json --noEmit

      - name: SAST · ESLint
        run: npm run lint

  # ===========================================================================
  # DESPLIEGUE — a Cloudflare Pages, solo tras pasar las puertas, solo en push a
  # master, con aprobación del Environment 'production'.
  # ===========================================================================
  deploy:
    name: Deploy to Cloudflare Pages
    needs: security-gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production # exige reviewers/protección configurados en GitHub
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts # no lifecycle scripts en el job con credenciales

      - name: Build
        run: npm run build

      # Sube dist/ + functions/ a Cloudflare Pages. Los secrets de la Function
      # (RESEND_API_KEY, etc.) NO van aquí: viven en Cloudflare -> Pages -> Settings.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=axenor-webpage --branch=master

    # Secrets requeridos (GitHub → Settings → Secrets and variables → Actions):
    #   CLOUDFLARE_API_TOKEN   -> token con permiso "Cloudflare Pages: Edit"
    #   CLOUDFLARE_ACCOUNT_ID  -> Cloudflare dashboard (barra lateral / URL)
    #
    # Alternativa más simple: conectar el repo a Cloudflare Pages (Git nativo)
    # para que construya solo en cada push; en ese caso este job 'deploy' sobra.
